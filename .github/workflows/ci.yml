name: ci

# Everything Drone used to do, on GitHub's runners: lint, the Linux test run
# and the Docker image. Windows and the release live in windows.yml.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Read by the api package's init() when a test binary starts. Not secrets.
  DB_PATH: test.db
  OBS_WEBSOCKET_ADDRESS: localhost:4455
  OBS_WEBSOCKET_PASSWORD: testpassword
  OBS_PROXY_SCENE_NAME: TestProxyScene
  MEDIAMTX_API_ADDRESS: localhost:9997
  MEDIAMTX_RTMP_ADDRESS: localhost:1935
  API_ADMIN_USERNAME: testadmin
  API_ADMIN_PASSWORD: testpassword
  API_PORT: "18080"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: src
          args: --timeout=10m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: go test -race
        working-directory: src
        run: go test -race ./...

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:
      - uses: actions/checkout@v4

      # The image is only pushed when Docker Hub credentials exist, so the
      # pipeline is green before they are added rather than red for want of a
      # secret. The step warns instead of failing.
      - name: Check for Docker Hub credentials
        id: creds
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "${USERNAME}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set, so the image was built but not pushed"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: lanopsdev/lanops-stream-proxy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: resources/docker/Dockerfile
          # Build on pull requests for validation, push only on main and tags.
          push: ${{ github.event_name != 'pull_request' && steps.creds.outputs.ok == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
