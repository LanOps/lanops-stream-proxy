
services:
  mediamtx:
    image: bluenviron/mediamtx:1.14.0
    container_name: mediamtx
    network_mode: host
    environment:
      - MTX_API=yes
      - MTX_APIADDRESS=:9997
    stdin_open: true
    tty: true
    restart: unless-stopped

  stream-proxy:
    image: lanopsdev/lanops-stream-proxy:latest
    container_name: stream-proxy
    # Both containers share the host network so the proxy can reach OBS on
    # 127.0.0.1:4455 and MediaMTX on 127.0.0.1:9997 without extra wiring.
    network_mode: host
    depends_on:
      - mediamtx
    restart: unless-stopped
    environment:
      DB_PATH: /data/bridge.db
      # OBS and MediaMTX usually run on this machine, but the RTMP address
      # must be reachable from whatever machine OBS is running on.
      OBS_WEBSOCKET_ADDRESS: ${OBS_WEBSOCKET_ADDRESS:-127.0.0.1:4455}
      OBS_WEBSOCKET_PASSWORD: ${OBS_WEBSOCKET_PASSWORD:-}
      OBS_PROXY_SCENE_NAME: ${OBS_PROXY_SCENE_NAME:-Proxy Scenes}
      MEDIAMTX_API_ADDRESS: ${MEDIAMTX_API_ADDRESS:-127.0.0.1:9997}
      MEDIAMTX_RTMP_ADDRESS: ${MEDIAMTX_RTMP_ADDRESS:-127.0.0.1:1935}
      API_ADMIN_USERNAME: ${API_ADMIN_USERNAME:-}
      API_ADMIN_PASSWORD: ${API_ADMIN_PASSWORD:-}
      API_PORT: ${API_PORT:-8080}
    volumes:
      # Without this the stream list is rebuilt from scratch every time the
      # container is recreated.
      - ./data:/data
