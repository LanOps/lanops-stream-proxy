kind: pipeline
type: docker
name: ci

trigger:
  event:
    - push
    - pull_request
    - tag

steps:

# ── Lint ─────────────────────────────────────────────────────────────────────

  - name: discord-lint-start
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_SOURCE_BRANCH - Lint Started!\",\"url\":\"$DRONE_BUILD_LINK\"}]}"

  - name: lint
    image: golang:1.23
    commands:
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - cd /drone/src/src && go mod download && golangci-lint run --timeout=10m ./...

  - name: discord-lint-success
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_SOURCE_BRANCH - Lint Success!\",\"url\":\"$DRONE_BUILD_LINK\"}]}"
    when:
      status:
        - success

  - name: discord-lint-failure
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_SOURCE_BRANCH - Lint Failure!\",\"url\":\"$DRONE_BUILD_LINK\"}]}"
    when:
      status:
        - failure

# ── Tests ─────────────────────────────────────────────────────────────────────

  - name: discord-test-start
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_SOURCE_BRANCH - Test Started!\",\"url\":\"$DRONE_BUILD_LINK\"}]}"

  - name: test
    image: golang:1.23
    environment:
      # Dummy values required by the api package init() via config.Load().
      # These are not real secrets — no live OBS/MediaMTX is contacted during tests.
      DB_PATH: /tmp/stream-proxy-test.db
      OBS_WEBSOCKET_ADDRESS: localhost:4455
      OBS_WEBSOCKET_PASSWORD: testpassword
      OBS_PROXY_SCENE_NAME: TestProxyScene
      MEDIAMTX_API_ADDRESS: localhost:9997
      MEDIAMTX_RTMP_ADDRESS: localhost:1935
      API_ADMIN_USERNAME: testadmin
      API_ADMIN_PASSWORD: testpassword
      API_PORT: "18080"
    commands:
      - cd /drone/src/src && go test -race ./...

  # The proxy is deployed as a plain .exe on Windows, which only works while
  # the build stays cgo-free. This fails the build if a cgo dependency sneaks
  # back in, before anyone finds out at an event.
  - name: build-windows
    image: golang:1.23
    commands:
      - cd /drone/src/src && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o /tmp/stream-proxy-windows-amd64.exe ./cmd/stream-proxy

  - name: discord-test-success
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_SOURCE_BRANCH - Test Success!\",\"url\":\"$DRONE_BUILD_LINK\"}]}"
    when:
      status:
        - success

  - name: discord-test-failure
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_SOURCE_BRANCH - Test Failure!\",\"url\":\"$DRONE_BUILD_LINK\"}]}"
    when:
      status:
        - failure

# ── Docker Build & Push ───────────────────────────────────────────────────────
# Only runs on push to main or v* tags.

  - name: discord-build-start
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_SOURCE_BRANCH - Build Started!\",\"url\":\"$DRONE_BUILD_LINK\"}]}"
    when:
      ref:
        - refs/heads/main
        - refs/tags/**
      event:
        - push
        - tag

  - name: build-push
    image: plugins/docker
    settings:
      repo: lanopsdev/lanops-stream-proxy
      dockerfile: resources/docker/Dockerfile
      username:
        from_secret: dockerhub_username
      password:
        from_secret: dockerhub_token
      auto_tag: true
      auto_tag_aliases:
        - latest
    when:
      ref:
        - refs/heads/main
        - refs/tags/**
      event:
        - push
        - tag

# ── Windows bundle & draft release ────────────────────────────────────────────
# The zip is what people actually download. It is built on main so a broken
# packaging step is caught before a tag, and attached to a DRAFT release on
# tags so the notes and the decision to publish stay human.

  - name: bundle-windows
    image: golang:1.23
    environment:
      VERSION: ${DRONE_TAG}
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip zip
      - ./resources/windows/build-bundle.sh
      - ls -l dist
    when:
      ref:
        - refs/heads/main
        - refs/tags/**
      event:
        - push
        - tag

  - name: release-windows
    image: plugins/github-release
    settings:
      api_key:
        from_secret: github_token
      title: ${DRONE_TAG}
      note: "Windows bundle built from ${DRONE_COMMIT_SHA}. Write the notes, then publish."
      draft: true
      overwrite: true
      checksum: sha256
      files:
        - dist/lanops-stream-proxy-windows-*.zip
    when:
      event:
        - tag

  - name: discord-release
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_TAG - Windows bundle built, draft release ready\",\"url\":\"$DRONE_BUILD_LINK\"}]}"
    when:
      event:
        - tag
      status:
        - success

  - name: discord-build-success
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_SOURCE_BRANCH - Build Success!\",\"url\":\"$DRONE_BUILD_LINK\"}]}"
    when:
      ref:
        - refs/heads/main
        - refs/tags/**
      event:
        - push
        - tag
      status:
        - success

  - name: discord-build-failure
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_SOURCE_BRANCH - Build Failure!\",\"url\":\"$DRONE_BUILD_LINK\"}]}"
    when:
      ref:
        - refs/heads/main
        - refs/tags/**
      event:
        - push
        - tag
      status:
        - failure
